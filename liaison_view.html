<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luxer One — Property Cases</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #0D1B2A;
    --navy-mid:#111E2E;
    --teal:    #00A896;
    --green:   #1DAF6E;
    --red:     #E53D3D;
    --amber:   #D4870A;
    --blue:    #2E7CF6;
    --purple:  #8E44AD;
    --surface: #E8E6E0;
    --ink:     #B0B8C4;
    --border:  rgba(255,255,255,.08);
    --sans:    -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --mono:    "SF Mono", "Fira Mono", monospace;
  }

  body {
    font-family: var(--sans);
    background: var(--navy);
    color: var(--surface);
    min-height: 100vh;
  }

  /* ── LOADING ── */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    color: var(--ink);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ERROR ── */
  #error-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 12px;
    padding: 24px;
    text-align: center;
  }
  #error-screen h2 { color: var(--red); font-size: 18px; }
  #error-screen p  { color: var(--ink); font-size: 14px; line-height: 1.6; }

  /* ── MAIN ── */
  #main { display: none; max-width: 720px; margin: 0 auto; padding: 0 0 40px; }

  /* Header */
  .hdr {
    background: var(--navy-mid);
    border-bottom: 1px solid var(--border);
    padding: 20px 20px 16px;
    position: sticky; top: 0; z-index: 10;
  }
  .hdr-label { font-size: 10px; color: var(--teal); font-weight: 700; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 4px; }
  .hdr-title { font-size: 20px; font-weight: 700; color: #fff; }
  .hdr-sub   { font-size: 12px; color: var(--ink); margin-top: 3px; }

  /* Summary bar */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
    background: var(--navy-mid);
  }
  .sum-cell {
    padding: 14px 8px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .sum-cell:last-child { border-right: none; }
  .sum-num  { font-family: var(--mono); font-size: 24px; font-weight: 700; line-height: 1; }
  .sum-lbl  { font-size: 9px; color: var(--ink); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }

  /* Section headers */
  .section-hdr {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 16px 10px;
  }
  .section-bar { width: 4px; height: 18px; border-radius: 2px; }
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .section-count { font-family: var(--mono); font-size: 12px; font-weight: 700; }

  /* Case card */
  .case-card {
    margin: 0 12px 14px;
    background: #141F2E;
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .case-card.overdue   { border-left: 4px solid var(--red); }
  .case-card.approaching { border-left: 4px solid var(--amber); }
  .case-card.investigating { border-left: 4px solid var(--blue); }
  .case-card.not-started { border-left: 4px solid var(--ink); }

  .card-hdr {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }
  .card-name  { font-size: 17px; font-weight: 800; color: #fff; }
  .card-unit  { font-size: 14px; font-weight: 600; color: var(--teal); font-family: var(--mono); margin-left: 8px; }
  .card-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap;
  }
  .badge-overdue      { background: rgba(229,61,61,.15); color: var(--red); }
  .badge-approaching  { background: rgba(212,135,10,.15); color: var(--amber); }
  .badge-investigating{ background: rgba(46,124,246,.15); color: var(--blue); }
  .badge-notstarted   { background: rgba(176,184,196,.12); color: var(--ink); }
  .badge-returned     { background: rgba(142,68,173,.15); color: var(--purple); }

  .card-sub { font-size: 12px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
  .card-hours { font-family: var(--mono); font-weight: 700; }

  /* Details grid */
  .card-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .detail-row {
    padding: 6px 8px 6px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .detail-row:nth-child(even) { padding-left: 8px; border-left: 1px solid rgba(255,255,255,.04); }
  .detail-lbl { font-size: 10px; color: var(--ink); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
  .detail-val { font-size: 13px; color: var(--surface); font-weight: 500; word-break: break-word; }
  .detail-val.mono { font-family: var(--mono); font-size: 12px; }

  /* Status buttons */
  .card-btns { padding: 12px 16px; }
  .btn-lbl { font-size: 10px; color: var(--ink); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; font-weight: 700; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .status-btn {
    display: block;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    padding: 10px 6px;
    border-radius: 7px;
    text-align: center;
    color: #fff;
  }
  .btn-inv  { background: #1A5276; }
  .btn-res  { background: #1A7A3A; }
  .btn-utl  { background: #922B21; }
  .btn-rts  { background: #7D3C98; }

  /* Empty state */
  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--ink);
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--surface); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; line-height: 1.6; }

  /* Last updated bar */
  .last-updated {
    padding: 10px 16px;
    font-size: 11px;
    color: var(--ink);
    text-align: center;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px">Loading your cases...</div>
</div>

<div id="error-screen">
  <h2>Unable to Load</h2>
  <p id="error-msg">Could not connect to the data source. Please try again or contact your team lead.</p>
  <button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:var(--teal);color:var(--navy);border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;">Retry</button>
</div>

<div id="main">
  <div class="hdr">
    <div class="hdr-label">Luxer One — Property Report</div>
    <div class="hdr-title" id="hdr-property">Loading...</div>
    <div class="hdr-sub" id="hdr-sub"></div>
  </div>

  <div class="summary">
    <div class="sum-cell">
      <div class="sum-num" id="sum-total" style="color:var(--teal)">—</div>
      <div class="sum-lbl">Total Open</div>
    </div>
    <div class="sum-cell">
      <div class="sum-num" id="sum-overdue" style="color:var(--red)">—</div>
      <div class="sum-lbl">Overdue</div>
    </div>
    <div class="sum-cell">
      <div class="sum-num" id="sum-invest" style="color:var(--blue)">—</div>
      <div class="sum-lbl">Investigating</div>
    </div>
    <div class="sum-cell">
      <div class="sum-num" id="sum-ns" style="color:var(--amber)">—</div>
      <div class="sum-lbl">Not Started</div>
    </div>
  </div>

  <div id="cases-container"></div>
  <div class="last-updated" id="last-updated"></div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnjPxuRUPQG78eNfxNqjTD6yHWkKq9L-cM3ZSZQm4d-qW0IhsvwbTE5h_g87qSU3DW-A/exec";
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSftqdSP8o0z2UTkOgqWBT2oXWNX1O85E0YPeeeX1sxPq5MZ-A/viewform";
const VALID_CODES = ["liaison2026","andy2026","naema2026","salim2026"];
const OPEN_STATUSES = new Set(["Not Started","Overdue","Investigating",""]);

const params   = new URLSearchParams(window.location.search);
const authCode = (params.get("auth") || "").toLowerCase();
const property = decodeURIComponent(params.get("property") || "");

// Validate
if (!VALID_CODES.includes(authCode) || !property) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("error-screen").style.display = "flex";
  document.getElementById("error-msg").textContent = "Invalid or missing access link. Please use the link from your daily report email.";
} else {
  loadCases();
}

async function loadCases() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    const res  = await fetch(APPS_SCRIPT_URL + "?action=getData&t=" + Date.now(), {
      cache: "no-store",
      signal: controller.signal
    });
    clearTimeout(timeout);
    if (!res.ok) throw new Error("HTTP " + res.status + " — try redeploying Apps Script");
    const text = await res.text();
    if (text.trim().startsWith("<")) throw new Error("API returned HTML instead of JSON — Apps Script deployment needs to be refreshed. Go to Apps Script → Deploy → Manage → Edit → New version → Deploy");
    const json = JSON.parse(text);
    if (!json.inquiries) throw new Error("Invalid response format");
    const all  = (json.inquiries || []).filter(r => r.property === property);
    const open = all.filter(r => OPEN_STATUSES.has(r.status || ""));

    document.getElementById("loading").style.display = "none";
    document.getElementById("main").style.display    = "block";

    // Header
    document.getElementById("hdr-property").textContent = property;
    document.getElementById("hdr-sub").textContent      = new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    document.getElementById("last-updated").textContent  = "Last updated " + new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}) + " · Tap Retry to refresh";

    // Summary
    const overdue  = open.filter(r => r.status === "Overdue");
    const invest   = open.filter(r => r.status === "Investigating");
    const ns       = open.filter(r => r.status === "Not Started" || r.status === "");
    document.getElementById("sum-total").textContent   = open.length;
    document.getElementById("sum-overdue").textContent = overdue.length;
    document.getElementById("sum-invest").textContent  = invest.length;
    document.getElementById("sum-ns").textContent      = ns.length;

    // Sort: overdue first, then by hours descending
    open.sort((a,b) => {
      const order = {Overdue:0,Investigating:1,"Not Started":2,"":2};
      const ao = order[a.status] ?? 2, bo = order[b.status] ?? 2;
      if (ao !== bo) return ao - bo;
      return new Date(a.timestamp) - new Date(b.timestamp);
    });

    if (open.length === 0) {
      document.getElementById("cases-container").innerHTML = `
        <div class="empty">
          <div class="empty-icon">✓</div>
          <div class="empty-title">All clear for ${property}</div>
          <div class="empty-sub">No open cases require attention right now.</div>
        </div>`;
      return;
    }

    // Build sections
    const sections = [
      { label: "Overdue — Immediate Action", color: "var(--red)",   items: overdue,  cls: "overdue" },
      { label: "Investigating",              color: "var(--blue)",  items: invest,   cls: "investigating" },
      { label: "Not Started",               color: "var(--amber)", items: ns,       cls: "not-started" },
    ];

    let html = "";
    sections.forEach(sec => {
      if (!sec.items.length) return;
      html += `
      <div class="section-hdr">
        <div class="section-bar" style="background:${sec.color}"></div>
        <span class="section-title" style="color:${sec.color}">${sec.label}</span>
        <span class="section-count" style="color:${sec.color}">(${sec.items.length})</span>
      </div>`;
      sec.items.forEach(r => { html += buildCard(r, sec.cls); });
    });

    document.getElementById("cases-container").innerHTML = html;

    // Auto refresh every 5 minutes
    setTimeout(loadCases, 5 * 60 * 1000);

  } catch(e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error-screen").style.display = "flex";
    document.getElementById("error-msg").textContent = "Connection error: " + e.message;
  }
}

function buildCard(r, cls) {
  const ts       = new Date(r.timestamp);
  const hoursOld = Math.round((Date.now() - ts) / 3600000);
  const subStr   = ts.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " at " + ts.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
  const enc      = t => encodeURIComponent(t || "");
  const linkBase = FORM_URL + "?usp=pp_url&entry.1540928277=" + enc(r.tracking) + "&entry.1095817002=" + enc(property);
  const linkInv  = linkBase + "&entry.1196707356=Investigating";
  const linkRes  = linkBase + "&entry.1196707356=Resolved";
  const linkUtl  = linkBase + "&entry.1196707356=Unable+to+Locate";
  const linkRts  = linkBase + "&entry.1196707356=Returned+to+Sender";

  const badgeMap = {
    "Overdue":       `<span class="card-badge badge-overdue">● Overdue</span>`,
    "Investigating": `<span class="card-badge badge-investigating">● Investigating</span>`,
    "Not Started":   `<span class="card-badge badge-notstarted">● Not Started</span>`,
    "":              `<span class="card-badge badge-notstarted">● Not Started</span>`,
  };
  const badge = badgeMap[r.status] || `<span class="card-badge badge-notstarted">● ${r.status}</span>`;

  const hoursColor = hoursOld >= 72 ? "var(--red)" : hoursOld >= 48 ? "var(--amber)" : "var(--blue)";

  return `
  <div class="case-card ${cls}">
    <div class="card-hdr">
      <div class="card-top">
        <div>
          <span class="card-name">${r.name || "Unknown"}</span>
          <span class="card-unit">Unit ${r.unit || "—"}</span>
        </div>
        ${badge}
      </div>
      <div class="card-sub">
        <span class="card-hours" style="color:${hoursColor}">${hoursOld}h open</span>
        <span>·</span>
        <span>Submitted ${subStr}</span>
      </div>
    </div>
    <div class="card-details">
      <div class="detail-row">
        <div class="detail-lbl">Carrier</div>
        <div class="detail-val">${r.carrier || "—"}</div>
      </div>
      <div class="detail-row">
        <div class="detail-lbl">Tracking</div>
        <div class="detail-val mono">${r.tracking || "—"}</div>
      </div>
      <div class="detail-row">
        <div class="detail-lbl">Delivery Date</div>
        <div class="detail-val">${r.deliveryDate || "—"}</div>
      </div>
      <div class="detail-row">
        <div class="detail-lbl">Luxer Code</div>
        <div class="detail-val mono">${r.accessCode || "—"}</div>
      </div>
      <div class="detail-row" style="grid-column:1/-1">
        <div class="detail-lbl">Description</div>
        <div class="detail-val">${r.description || "—"}</div>
      </div>
      <div class="detail-row" style="grid-column:1/-1">
        <div class="detail-lbl">Resident Email</div>
        <div class="detail-val">${r.email || "—"}</div>
      </div>
    </div>
    <div class="card-btns">
      <div class="btn-lbl">Update Status</div>
      <div class="btn-grid">
        <a href="${linkInv}" class="status-btn btn-inv">Investigating</a>
        <a href="${linkRes}" class="status-btn btn-res">Resolved</a>
        <a href="${linkUtl}" class="status-btn btn-utl">Unable to Locate</a>
        <a href="${linkRts}" class="status-btn btn-rts">Returned to Sender</a>
      </div>
    </div>
  </div>`;
}
</script>
</body>
</html>
